<div class="login-page-container">
  <!-- Botón de accesibilidad flotante -->
  <button mat-fab class="accessibility-fab" color="primary">
    <mat-icon>accessible</mat-icon>
  </button>

  <mat-card class="login-card mat-elevation-z4">
    <div class="login-header">
      <div class="shield-icon">
        <mat-icon color="primary">security</mat-icon>
      </div>
      <h2>Iniciar Sesión</h2>
      <p>Portal Ciudadano — Municipalidad</p>
    </div>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">

        <div class="form-field-wrapper">
          <label class="custom-label">Correo electrónico</label>
          <mat-form-field appearance="outline" class="full-width">
            <input matInput formControlName="correo" placeholder="ejemplo@gmail.com" type="email">
          </mat-form-field>
        </div>

        <div class="form-field-wrapper">
          <label class="custom-label">Contraseña</label>
          <mat-form-field appearance="outline" class="full-width" [class.error-state]="loginError()">
            <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" placeholder="••••••••••••">
            <button mat-icon-button matSuffix (click)="hidePassword.set(!hidePassword())" type="button">
              <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>
        </div>

        <div class="form-field-wrapper">
          <mat-checkbox formControlName="recordarme" color="primary" class="remember-checkbox">
            Mantener sesión iniciada
          </mat-checkbox>
        </div>

        <!-- Alerta de Error (Se muestra solo si loginError es true) -->
        <div class="error-alert" *ngIf="loginError()">
          <mat-icon>warning_amber</mat-icon>
          <span>Credenciales incorrectas. Intente nuevamente.</span>
        </div>

        <button mat-flat-button color="primary" class="btn-ingresar" type="submit" [disabled]="loginForm.invalid">
          Ingresar
        </button>

        <div class="divider">
          <span>O CONTINUAR CON</span>
        </div>

        <button mat-stroked-button class="btn-reniec" type="button">
          <mat-icon>badge</mat-icon> Consultar con RENIEC
        </button>
      </form>
    </mat-card-content>

    <div class="login-footer">
      <p>¿No tienes una cuenta? <a routerLink="/usuarios-registro">Crear cuenta</a></p>
      <a href="javascript:void(0)" class="admin-link" (click)="autocompletarAdmin()">Acceso para administradores</a>
    </div>
  </mat-card>
</div>
